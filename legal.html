<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>特定商取引法に基づく表記 | ミセサポ365</title>
  <meta name="description" content="ミセサポ365の特定商取引法に基づく表記です。販売事業者、サービス名、販売価格、お支払い方法、解約についてご案内します。">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background: #f4f1e9;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }
    .page {
      position: relative;
      width: min(100%, 1672px);
      margin: 0 auto;
      line-height: 0;
      background: #fffdf7;
    }
    .page img {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
    }
    .mobile-image {
      display: none !important;
    }
    .hotspot {
      position: absolute;
      display: block;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(247, 181, 0, .2);
    }
    .hotspot:focus-visible {
      outline: 3px solid rgba(255, 122, 26, .8);
      outline-offset: 3px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 699px) {
      .page {
        width: min(100%, 430px);
      }
      .pc-image {
        display: none !important;
      }
      .mobile-image {
        display: block !important;
      }
      .home-hotspot {
        left: 3% !important;
        top: 1% !important;
        width: 42% !important;
        height: 6.5% !important;
      }
      .menu-hotspot {
        left: 87% !important;
        top: .8% !important;
        width: 11% !important;
        height: 6.2% !important;
      }
      .contact-hotspot {
        left: 8.5% !important;
        top: 86.7% !important;
        width: 83% !important;
        height: 5.5% !important;
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-labelledby="page-title">
    <img class="pc-image" src="assets_pc/page_legal.png" width="1672" height="941" alt="">
    <img class="mobile-image" src="assets/page_legal_mobile.png" width="941" height="1672" alt="">
    <a class="hotspot home-hotspot" href="index.html" style="left: 2%; top: 2%; width: 32%; height: 9%;" aria-label="トップページへ戻る"></a>
    <a class="hotspot contact-hotspot" href="contact.html" style="left: 61%; top: 78%; width: 35%; height: 9%;" aria-label="お問い合わせはこちら"></a>
    <button class="hotspot menu-hotspot" type="button" style="left: 93%; top: 2%; width: 6%; height: 11%;" aria-label="メニュー"></button>
    <div class="sr-only">
      <h1 id="page-title">特定商取引法に基づく表記</h1>
      <p>販売事業者は花田将也、所在地は福岡県那珂川市中原3-101です。</p>
      <p>サービス名はミセサポ365、販売価格は月額30,000円税込からです。お支払い方法はクレジットカード決済または銀行振込です。</p>
      <p>解約をご希望の場合は、次回請求日の10日前までにお問い合わせフォームよりご連絡ください。</p>
    </div>
  </main>
</body>
</html>
