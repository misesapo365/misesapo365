<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>プライバシーポリシー | ミセサポ365</title>
  <meta name="description" content="ミセサポ365のプライバシーポリシーです。お問い合わせ時にいただく個人情報の取り扱いについてご案内します。">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background: #f4f1e9;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }
    .page {
      position: relative;
      width: min(100%, 1738px);
      margin: 0 auto;
      line-height: 0;
      background: #fffdf7;
    }
    .page img {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
    }
    .mobile-image {
      display: none !important;
    }
    .hotspot {
      position: absolute;
      display: block;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(247, 181, 0, .2);
    }
    .hotspot:focus-visible {
      outline: 3px solid rgba(255, 122, 26, .8);
      outline-offset: 3px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 699px) {
      .page {
        width: min(100%, 430px);
      }
      .pc-image {
        display: none !important;
      }
      .mobile-image {
        display: block !important;
      }
      .home-hotspot {
        left: 3% !important;
        top: 1% !important;
        width: 42% !important;
        height: 6.5% !important;
      }
      .menu-hotspot {
        left: 87% !important;
        top: .8% !important;
        width: 11% !important;
        height: 6.2% !important;
      }
      .contact-hotspot {
        left: 4.5% !important;
        top: 78% !important;
        width: 91% !important;
        height: 6% !important;
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-labelledby="page-title">
    <img class="pc-image" src="assets_pc/page_privacy.png" width="1738" height="905" alt="">
    <img class="mobile-image" src="assets/page_privacy_mobile.png" width="941" height="1672" alt="">
    <a class="hotspot home-hotspot" href="index.html" style="left: 2%; top: 2%; width: 31%; height: 10%;" aria-label="トップページへ戻る"></a>
    <a class="hotspot contact-hotspot" href="contact.html" style="left: 4%; top: 82%; width: 23%; height: 9%;" aria-label="お問い合わせはこちら"></a>
    <button class="hotspot menu-hotspot" type="button" style="left: 92%; top: 2%; width: 7%; height: 13%;" aria-label="メニュー"></button>
    <div class="sr-only">
      <h1 id="page-title">プライバシーポリシー</h1>
      <p>ミセサポ365では、お問い合わせ時にいただく氏名、メールアドレス、電話番号、会社名などの情報を適切に管理します。</p>
      <p>取得した情報は、お問い合わせ対応、サービス提供、改善のために利用します。法令に基づく場合を除き、第三者に提供しません。</p>
      <p>個人情報に関するお問い合わせは、問い合わせフォームよりご連絡ください。</p>
    </div>
  </main>
</body>
</html>
